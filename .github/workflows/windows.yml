name: Windows

on:
  push:
    branches: [850cloud]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.10.3"
  # Shallow checkouts carry no tags, so the versions normally taken from `git describe` are given here.
  APP_VERSION: "1.0.0"
  SDK_VERSION: "5.5.36"
  BUILD_DIR: C:\b
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Disk space
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: msys2/setup-msys2@v2
        with:
          release: false
          update: true
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            base-devel make perl bzip2 nasm yasm doxygen gawk sed patch intltool
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-libsystre

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Python modules
        run: python -m pip install six pystache

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtnetworkauth qtshadertools
          cache: true

      - name: NSIS
        run: choco install nsis -y --no-progress

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: |
          $env:PATH = "$env:PATH;C:\msys64\mingw64\bin;C:\msys64;C:\msys64\usr\bin;C:\Program Files (x86)\NSIS"
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLINPHONESDK_PLATFORM=Desktop `
            -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_RC_COMPILER=rc.exe `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_BUILD_PARALLEL_LEVEL=4 `
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" `
            -DENABLE_CRASH_HANDLER=OFF `
            -DENABLE_PQCRYPTO=OFF `
            -DENABLE_AV1=OFF `
            -DENABLE_G729=ON `
            -DENABLE_GPL_THIRD_PARTIES=OFF `
            -DENABLE_APP_PACKAGING=ON `
            -DLINPHONEAPP_VERSION="$env:APP_VERSION" `
            -DLINPHONESDK_VERSION="$env:SDK_VERSION" `
            -DLINPHONESDK_STATE=release `
            -DLINPHONESDK_BRANCH="release/5.5"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build
        run: |
          $env:PATH = "$env:PATH;C:\msys64\mingw64\bin;C:\msys64;C:\msys64\usr\bin;C:\Program Files (x86)\NSIS"
          cmake --build $env:BUILD_DIR --target install --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.BUILD_DIR }}\OUTPUT\Packages\*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            ${{ env.BUILD_DIR }}\CMakeFiles\CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}\**\*-err.log
            ${{ env.BUILD_DIR }}\**\*-out.log
          if-no-files-found: ignore

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ env.BUILD_DIR }}\OUTPUT\Packages\*.exe
